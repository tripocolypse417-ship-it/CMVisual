name: backend-security-contracts

on:
  pull_request:
    paths:
      - 'base44/functions/**'
      - 'scripts/test-backend-function-security.mjs'
      - '.github/workflows/backend-security-contracts.yml'
  push:
    branches:
      - waveradar-os/security-hardening

jobs:
  backend-security-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify privileged function authorization and approved marketing copy
        run: node scripts/test-backend-function-security.mjs
