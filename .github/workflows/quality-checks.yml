name: WaveRadar Code Quality Checks

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Audit canonical data contract
        run: npm run audit:data

      - name: Check JavaScript and JSX lint
        run: npm run lint

      - name: Check project types
        run: npm run typecheck

      - name: Build web application
        run: npm run build
