name: WaveRadar Code Quality Checks

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Audit canonical data contract
        run: npm run audit:data

      - name: Test federated observation envelope
        run: npm run test:federation-envelope

      - name: Check JavaScript and JSX lint
        run: npm run lint

      # The legacy project-wide JS/JSX typecheck currently reports pre-existing
      # typing errors in shared UI components and third-party Leaflet JS.
      # Keep the signal visible without blocking lint, data-contract audit, or build.
      - name: Legacy project typecheck (known baseline debt)
        run: npm run typecheck
        continue-on-error: true

      - name: Build web application
        run: npm run build
