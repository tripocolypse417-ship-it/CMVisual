name: WaveRadar Cloud Coordinator

on:
  schedule:
    # 15:00 UTC is 09:00 Central during standard time; GitHub cron is UTC.
    - cron: "0 15 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  actions: read

concurrency:
  group: waveradar-cloud-coordinator
  cancel-in-progress: false

jobs:
  coordinator:
    name: Daily engineering snapshot
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install

      - name: Run canonical data-contract audit
        run: npm run audit:data

      - name: Run lint
        run: npm run lint

      - name: Run operational runtime safety checks
        run: node scripts/audit-operational-runtime.mjs

      - name: Build web application
        run: npm run build

      - name: Capture repository state
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p coordinator-report
          gh api "repos/${GITHUB_REPOSITORY}/pulls?state=open&per_page=100" > coordinator-report/open-pull-requests.json
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs?per_page=20" > coordinator-report/recent-workflow-runs.json
          gh api "repos/${GITHUB_REPOSITORY}/commits?per_page=10" > coordinator-report/recent-commits.json
          {
            echo "# WaveRadar Cloud Coordinator"
            echo
            echo "- Repository: ${GITHUB_REPOSITORY}"
            echo "- Commit: ${GITHUB_SHA}"
            echo "- Branch: ${GITHUB_REF_NAME}"
            echo "- Run: ${GITHUB_RUN_ID}"
            echo "- UTC time: $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
            echo
            echo "## Automated checks"
            echo "- Data-contract audit: passed (job would stop on failure)"
            echo "- Lint: passed (job would stop on failure)"
            echo "- Runtime safety audit: passed (job would stop on failure)"
            echo "- Web build: passed (job would stop on failure)"
            echo
            echo "## Repository snapshot"
            echo "- Open pull requests: $(jq 'length' coordinator-report/open-pull-requests.json)"
            echo "- Recent workflow runs captured: $(jq '.workflow_runs | length' coordinator-report/recent-workflow-runs.json)"
            echo "- Recent commits captured: $(jq 'length' coordinator-report/recent-commits.json)"
            echo
            echo "This report is a deterministic engineering snapshot. It does not represent independent physical validation, and it does not make code changes."
          } > coordinator-report/REPORT.md
          cat coordinator-report/REPORT.md >> "$GITHUB_STEP_SUMMARY"

      - name: Preserve coordinator report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: waveradar-cloud-coordinator-${{ github.run_id }}
          path: coordinator-report/
          if-no-files-found: warn
          retention-days: 30
