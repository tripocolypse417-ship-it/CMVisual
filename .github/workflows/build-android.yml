name: Build WaveRadar Android APK

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  android-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      WAVERADAR_HOSTED_URL: https://waveradar-20.hatchable.site/workspace/
      WAVERADAR_DEBUG_KEYSTORE_BASE64: ${{ secrets.WAVERADAR_DEBUG_KEYSTORE_BASE64 }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm install

      - name: Audit canonical data contract
        run: npm run audit:data

      - name: Inventory provider dependencies
        run: npm run audit:providers

      - name: Test World Model contract and provenance gates
        run: npm run test:world-model-contract

      - name: Test validation queue archive and restore
        run: npm run test:validation-queue-archive

      - name: Test malformed array boundaries
        run: npm run test:array-boundaries

      - name: Test physical-validation queue safety
        run: npm run test:physical-validation-queue

      - name: Test physical-validation evidence provenance
        run: npm run test:physical-validation-evidence

      - name: Test native sensor registration lifecycle
        run: npm run test:native-sensor-lifecycle

      - name: Build web application
        run: npm run build

      - name: Generate Capacitor Android project
        run: npx cap add android

      - name: Install verified WaveRadar native sensor bridge
        run: |
          mkdir -p android/app/src/main/java/com/waveradar/app
          cp native/android/MainActivity.java android/app/src/main/java/com/waveradar/app/MainActivity.java
          cp native/android/WaveRadarSensorsPlugin.java android/app/src/main/java/com/waveradar/app/WaveRadarSensorsPlugin.java
          cp native/android/WaveRadarRangingPlugin.java android/app/src/main/java/com/waveradar/app/WaveRadarRangingPlugin.java
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()
          perms = [
              '    <uses-permission android:name="android.permission.CAMERA" />',
              '    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />',
              '    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />',
              '    <uses-permission android:name="android.permission.NEARBY_WIFI_DEVICES" />',
          ]
          marker = '</manifest>'
          for perm in perms:
              if perm not in s:
                  s = s.replace(marker, perm + '\n' + marker)
          p.write_text(s)
          PY

      - name: Sync web assets and Capacitor plugins
        run: npx cap sync android

      - name: Restore persistent debug signing identity
        shell: bash
        run: |
          mkdir -p "$HOME/.android"
          if [ -n "${WAVERADAR_DEBUG_KEYSTORE_BASE64:-}" ]; then
            printf '%s' "$WAVERADAR_DEBUG_KEYSTORE_BASE64" | base64 --decode > "$HOME/.android/debug.keystore"
            keytool -list -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey >/dev/null
            echo "Signing mode: persistent WaveRadar debug key." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::WAVERADAR_DEBUG_KEYSTORE_BASE64 is not configured. This APK uses a runner-generated debug key and is not guaranteed to update an installed build."
            echo "Signing mode: ephemeral debug key; update compatibility is not guaranteed." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WaveRadar-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish GitHub release (requires release-write permission)
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="waveradar-build-${{ github.run_number }}"
          gh release create "$TAG" android/app/build/outputs/apk/debug/app-debug.apk \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "WaveRadar Android Build ${{ github.run_number }}" \
            --notes "Phone-downloadable WaveRadar debug APK from commit ${{ github.sha }}."
