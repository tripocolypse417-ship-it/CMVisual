name: Build WaveRadar Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  android-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm install

      - name: Build web application
        run: npm run build

      - name: Generate Capacitor Android project
        run: npx cap add android

      - name: Install verified WaveRadar native sensor bridge
        run: |
          mkdir -p android/app/src/main/java/com/waveradar/app
          cp native/android/MainActivity.java android/app/src/main/java/com/waveradar/app/MainActivity.java
          cp native/android/WaveRadarSensorsPlugin.java android/app/src/main/java/com/waveradar/app/WaveRadarSensorsPlugin.java
          cp native/android/WaveRadarRangingPlugin.java android/app/src/main/java/com/waveradar/app/WaveRadarRangingPlugin.java
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()
          perms = [
              '    <uses-permission android:name="android.permission.CAMERA" />',
              '    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />',
              '    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />',
              '    <uses-permission android:name="android.permission.NEARBY_WIFI_DEVICES" />',
          ]
          marker = '</manifest>'
          for perm in perms:
              if perm not in s:
                  s = s.replace(marker, perm + '\\n' + marker)
          p.write_text(s)
          PY

      - name: Sync web assets and Capacitor plugins
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WaveRadar-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish phone-downloadable release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="waveradar-build-${{ github.run_number }}"
          gh release create "$TAG" android/app/build/outputs/apk/debug/app-debug.apk \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "WaveRadar Android Build ${{ github.run_number }}" \
            --notes "Phone-downloadable WaveRadar debug APK from commit ${{ github.sha }}."
