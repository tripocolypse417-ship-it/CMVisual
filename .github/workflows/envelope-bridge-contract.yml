name: WaveRadar Envelope Bridge Contract
on:
  pull_request:
    paths:
      - 'src/lib/envelopeLedgerBridge.js'
      - 'scripts/test-envelope-ledger-bridge.mjs'
      - '.github/workflows/envelope-bridge-contract.yml'
  workflow_dispatch:
jobs:
  contract:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run dependency-free evidence bridge tests
        run: node scripts/test-envelope-ledger-bridge.mjs
