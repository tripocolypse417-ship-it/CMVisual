name: Build WaveRadar Offline-Shell APK (Experimental)

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'capacitor.config.ts'
      - 'native/android/**'
      - '.github/workflows/build-android-offline.yml'
      - 'package.json'
      - 'src/**'
      - 'public/**'

permissions:
  contents: read

jobs:
  offline-shell-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      WAVERADAR_DEBUG_KEYSTORE_BASE64: ${{ secrets.WAVERADAR_DEBUG_KEYSTORE_BASE64 }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm install

      - name: Run evidence and sensor safety tests
        run: |
          npm run audit:data
          npm run test:array-boundaries
          npm run test:physical-validation-queue
          npm run test:physical-validation-evidence
          npm run test:native-sensor-lifecycle

      - name: Build bundled web application
        run: npm run build

      - name: Verify build output exists
        run: |
          test -s dist/index.html
          echo "Bundled web entrypoint exists." >> "$GITHUB_STEP_SUMMARY"

      - name: Generate Capacitor Android project without hosted URL
        run: |
          unset WAVERADAR_HOSTED_URL
          npx cap add android

      - name: Install WaveRadar native sensor bridge
        run: |
          mkdir -p android/app/src/main/java/com/waveradar/app
          cp native/android/MainActivity.java android/app/src/main/java/com/waveradar/app/MainActivity.java
          cp native/android/WaveRadarSensorsPlugin.java android/app/src/main/java/com/waveradar/app/WaveRadarSensorsPlugin.java
          cp native/android/WaveRadarRangingPlugin.java android/app/src/main/java/com/waveradar/app/WaveRadarRangingPlugin.java
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()
          perms = [
              '    <uses-permission android:name="android.permission.CAMERA" />',
              '    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />',
              '    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />',
              '    <uses-permission android:name="android.permission.NEARBY_WIFI_DEVICES" />',
          ]
          marker = '</manifest>'
          for perm in perms:
              if perm not in s:
                  s = s.replace(marker, perm + '\n' + marker)
          p.write_text(s)
          PY

      - name: Sync bundled assets and native plugins
        run: |
          unset WAVERADAR_HOSTED_URL
          npx cap sync android
          if grep -q 'server' android/capacitor.config.json; then
            echo "::error::Hosted server configuration found in offline-shell build."
            exit 1
          fi

      - name: Restore persistent debug signing identity when configured
        shell: bash
        run: |
          mkdir -p "$HOME/.android"
          if [ -n "${WAVERADAR_DEBUG_KEYSTORE_BASE64:-}" ]; then
            printf '%s' "$WAVERADAR_DEBUG_KEYSTORE_BASE64" | base64 --decode > "$HOME/.android/debug.keystore"
            keytool -list -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey >/dev/null
            echo "Persistent debug key configured." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::Persistent signing secret is not configured. This artifact is for isolated testing only and may not update an installed app."
          fi

      - name: Build experimental offline-shell APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Record APK identity and signing certificate
        shell: bash
        run: |
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          AAPT=$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -n 1)
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)
          test -n "$AAPT" && test -n "$APKSIGNER"
          {
            echo "APK SHA-256: $(sha256sum "$APK" | cut -d' ' -f1)"
            echo "Package identity:"
            "$AAPT" dump badging "$APK" | head -n 1
            echo "Signing certificate:"
            "$APKSIGNER" verify --print-certs "$APK"
          } | tee android/app/build/outputs/apk/debug/apk-identity.txt
          cat android/app/build/outputs/apk/debug/apk-identity.txt >> "$GITHUB_STEP_SUMMARY"

      - name: Upload experimental APK
        uses: actions/upload-artifact@v4
        with:
          name: WaveRadar-offline-shell-experimental
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/debug/apk-identity.txt
          if-no-files-found: error
          retention-days: 30
